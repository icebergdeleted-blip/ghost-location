name: Build native desktop installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
    env:
      GHOST_TARGET_PLATFORM: ${{ matrix.platform }}
      GHOST_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Last 3.12 release with macOS/Windows artifacts in actions/python-versions.
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Verify native runtime architecture
        run: node -e "if(process.platform!==process.env.GHOST_TARGET_PLATFORM || process.arch!==process.env.GHOST_TARGET_ARCH) throw new Error('Build host architecture does not match target')"
      - name: Install locked npm dependencies
        run: npm ci
      - name: Prepare bundled phone runtimes
        run: npm run runtime:prepare
        env:
          GHOST_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Test adapters and sidecar
        run: npm test
      - name: Build unsigned installers without publishing
        run: npm run dist -- --publish never --${{ matrix.arch }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ghost-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
      - name: Upload build provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            resources/adb/**/provenance.json
            resources/android/provenance.json
            resources/ios/**/build-info.json
            resources/ios/**/build-dependencies.txt
            sidecar/build/**/warn-ghost-ios.txt
            release/builder-effective-config.yaml
